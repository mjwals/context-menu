<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <title>Context Menu</title>
    <link href="contextmenu.css" rel="stylesheet" />

    <script
      src="https://kit.fontawesome.com/849cbce7c6.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="right-clickable">
      <p class="element">Right Clickable Text 1</p>
      <ul class="context-menu">
        <li><a href="https://www.bbc.co.uk" target="_blank">BBC</a></li>
        <li><a href="https://www.ebuyer.co.uk" target="_blank">Ebuyer</a></li>
        <li>
          <a href="https://www.fontawesome.com" target="_blank">Font Awesome</a>
        </li>
      </ul>
    </div>

    <div class="right-clickable">
      <p class="element">Right Clickable Text 2</p>
      <ul class="context-menu">
        <li>
          <a href="#"><i class="fas fa-copy"></i> Copy</a>
        </li>
        <li>
          <a href="#"><i class="fas fa-cut"></i> Cut</a>
        </li>
        <li>
          <a href="#"><i class="fas fa-paste"></i> Paste</a>
        </li>
      </ul>
    </div>

    <script src="contextmenu.js"></script>
  </body>
</html>
